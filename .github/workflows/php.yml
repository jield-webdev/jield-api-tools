name: PHP Composer and Release

on:
  push:
    branches:
      - '2.x'
    tags:
      - 'v2.*'
  pull_request:
    branches:
      - '2.x'

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - locked
          - highest
        php:
          - '8.4'
          - '8.5'
        include:
          # Some upstream dependencies still cap their PHP support at 8.4.
          # Keep minimum PHP versions and extension requirements enforced.
          - php: '8.5'
            composer-options: '--ignore-platform-req=php+'

    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: "${{ matrix.php }}"
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: "Install composer and dependencies"
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: ${{ matrix.composer-options }}

      - name: Run Lint Checker suite
        run: composer php-lint

      - name: PHPStan test
        run: composer phpstan

      - name: Run test suite
        run: composer test

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release and branch history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo 'Expected v2.MINOR.PATCH or v2.MINOR.PATCH-{alpha,beta,rc}.NUMBER.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/2.x

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "${options[@]}"
